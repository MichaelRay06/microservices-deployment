name: microservices-ci

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "kubernetes/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  GRADLEPATH: src/ad

jobs:

  # =======================================================
  # BUILD + TEST
  # =======================================================

  build_product_catalog:
    runs-on: ubuntu-latest
    continue-on-error: true

    defaults:
      run:
        working-directory: src/product-catalog

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Tidy Modules
        run: go mod tidy

      - name: Build Application
        run: go build -v -o product-catalog .

      - name: Run Tests
        run: go test ./... -v

  # =======================================================
  # GRADLE BUILD + TEST
  # =======================================================

  build_gradle:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make Gradle Wrapper Executable
        working-directory: src/ad
        run: chmod +x ./gradlew

      - name: Build and Test with Gradle
        working-directory: src/ad
        run: ./gradlew build --warning-mode all

  # =======================================================
  # DEPENDENCY SUBMISSION
  # =======================================================

  dependency-submission:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make Gradle Wrapper Executable
        working-directory: src/ad
        run: chmod +x ./gradlew

  # =======================================================
  # SECURITY SCANNING
  # =======================================================

  gitleaks:
    runs-on: ubuntu-latest
    needs: [build_product_catalog, build_gradle]
    if: always()
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --verbose --redact

  trivy_fs:
    runs-on: ubuntu-latest
    needs: [build_product_catalog, build_gradle]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  golangci_lint:
    runs-on: ubuntu-latest
    needs: build_product_catalog
    if: always()
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
          working-directory: src/product-catalog

  # =======================================================
  # DOCKER BUILD + SCAN + PUSH
  # =======================================================

  docker_product_catalog:
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy_fs, golangci_lint]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------
      # BUILD IMAGE LOCALLY
      # ---------------------------------------------------

      - name: Build Product Catalog Docker Image
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/product-catalog:latest

      # ---------------------------------------------------
      # SCAN IMAGE WITH TRIVY DOCKER IMAGE
      # ---------------------------------------------------

      - name: Scan Product Catalog Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache:/root/.cache/ \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}

      # ---------------------------------------------------
      # LOGIN TO DOCKER HUB
      # ---------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ---------------------------------------------------
      # PUSH IMAGE
      # ---------------------------------------------------

      - name: Push Product Catalog Image
        run: |
          docker push ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}/product-catalog:latest

  docker_ad:
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy_fs]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------
      # BUILD IMAGE LOCALLY
      # ---------------------------------------------------

      - name: Build Ad Docker Image
        uses: docker/build-push-action@v6
        with:
          context: src/ad
          file: src/ad/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/ad:latest

      # ---------------------------------------------------
      # SCAN IMAGE WITH TRIVY DOCKER IMAGE
      # ---------------------------------------------------

      - name: Scan Ad Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache:/root/.cache/ \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}

      # ---------------------------------------------------
      # LOGIN TO DOCKER HUB
      # ---------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ---------------------------------------------------
      # PUSH IMAGE
      # ---------------------------------------------------

      - name: Push Ad Image
        run: |
          docker push ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}/ad:latest

  # =======================================================
  # GITOPS DEPLOYMENT
  # =======================================================

  update_product_catalog:
    runs-on: ubuntu-latest
    needs: docker_product_catalog
    if: success()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - name: Update Product Catalog Deployment Manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.sha }}|" \
          kubernetes/productcatalog/deploy.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.email "${{ secrets.DOCKER_USER_EMAIL }}"
          git config --global user.name "${{ secrets.DOCKER_USERNAME }}"

          git add kubernetes/productcatalog/deploy.yaml

          git commit -m "[CI]: Update product catalog image tag" || \
          echo "No changes to commit"

          git push origin HEAD:main

  update_ad:
    runs-on: ubuntu-latest
    needs: docker_ad
    if: success()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - name: Update Ad Deployment Manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/ad:${{ github.sha }}|" \
          kubernetes/ad/deploy.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.email "${{ secrets.DOCKER_USER_EMAIL }}"
          git config --global user.name "${{ secrets.DOCKER_USERNAME }}"

          git add kubernetes/ad/deploy.yaml

          git commit -m "[CI]: Update ad image tag" || \
          echo "No changes to commit"

          git push origin HEAD:main