name: microservices-ci

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "kubernetes/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  GRADLEPATH: src/ad

jobs:

  # =======================================================
  # BUILD + TEST
  # =======================================================

  build_product_catalog:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: src/product-catalog

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - run: go mod download
      - run: go mod tidy
      - run: go build -v -o product-catalog .
      - run: go test ./... -v

  # ==============================================
  # GRADLE BUILD AND TEST
  # ==============================================

build_gradle:
  runs-on: ubuntu-latest
  permissions:
    contents: read

  steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Setup Gradle 8.8
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.8"

    - name: Make Gradle Wrapper Executable
      run: chmod +x ./gradlew
      working-directory: src/ad

    - name: Build and Test with Gradle Wrapper
      run: ./gradlew build --warning-mode all
      working-directory: src/ad

dependency-submission:
  runs-on: ubuntu-latest
  permissions:
    contents: write

  steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
  # -----------------------------------------------
  # PYTHON BUILD AND TEST
  # -----------------------------------------------

  build_python:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run pytest
        run: |
          pip install pytest
          export PYTHONPATH=src/recommendation

  # =======================================================
  # SECURITY (ALWAYS RUN)
  # =======================================================

  gitleaks:
    runs-on: ubuntu-latest
    needs: [build_product_catalog, build_python, build_gradle]
    if: always()
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --verbose --redact

  trivy_fs:
    runs-on: ubuntu-latest
    needs: [build_product_catalog, build_python, build_gradle]
    if: always()

    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  golangci_lint:
    runs-on: ubuntu-latest
    needs: build_product_catalog
    if: always()
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
          working-directory: src/product-catalog

  # =======================================================
  # DOCKER BUILD & PUSH (ALWAYS TRY)
  # =======================================================

  docker_product_catalog:
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy_fs, golangci_lint]
    if: always()

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/product-catalog:latest

  docker_ad:
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy_fs]
    if: always()

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src/ad
          file: src/ad/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/ad:latest

  # =======================================================
  # GITOPS DEPLOY (ONLY IF DOCKER SUCCEEDS)
  # =======================================================

  update_product_catalog:
    runs-on: ubuntu-latest
    needs: docker_product_catalog
    if: success()

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - run: |
          sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}|" \
          kubernetes/productcatalog/deploy.yaml

      - run: |
          git config --global user.email ${{ secrets.DOCKER_USER_EMAIL }}
          git config --global user.name ${{ secrets.DOCKER_USERNAME }}
          git add kubernetes/productcatalog/deploy.yaml
          git diff --quiet || git commit -m "[GitOps] product-catalog -> ${{ env.IMAGE_TAG }}"
          git push origin HEAD:main

  update_ad:
    runs-on: ubuntu-latest
    needs: docker_ad
    if: success()

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - run: |
          sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}|" \
          kubernetes/ad/deploy.yaml

      - run: |
          git config --global user.email ${{ secrets.DOCKER_USER_EMAIL }}
          git config --global user.name ${{ secrets.DOCKER_USERNAME }}
          git add kubernetes/ad/deploy.yaml
          git diff --quiet || git commit -m "[GitOps] ad -> ${{ env.IMAGE_TAG }}"
          git push origin HEAD:main