name: microservices-ci

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "kubernetes/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  GRADLEPATH: src/ad

jobs:

  # =======================================================
  # BUILD + TEST
  # =======================================================

  build_product_catalog:
    runs-on: ubuntu-latest
    continue-on-error: true

    defaults:
      run:
        working-directory: src/product-catalog

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - run: go mod download
      - run: go mod tidy
      - run: go build -v -o product-catalog .
      - run: go test ./... -v

  # ==============================================
  # GRADLE BUILD AND TEST
  # ==============================================

  build_gradle:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
        working-directory: src/ad

      - name: Build with Gradle
        run: ./gradlew build --warning-mode all
        working-directory: src/ad

  dependency-submission:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
        working-directory: src/ad

  # =======================================================
  # SECURITY
  # =======================================================

  gitleaks:
    runs-on: ubuntu-latest
    needs: [build_product_catalog, build_gradle]
    if: always()
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --verbose --redact

  trivy_fs:
    runs-on: ubuntu-latest
    needs: [build_product_catalog, build_gradle]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  golangci_lint:
    runs-on: ubuntu-latest
    needs: build_product_catalog
    if: always()
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
          working-directory: src/product-catalog

  # =======================================================
  # DOCKER BUILD + SCAN + PUSH
  # =======================================================

  docker_product_catalog:
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy_fs, golangci_lint]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BUILD IMAGE LOCALLY (NO PUSH YET)
      - name: Build Product Catalog Image
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/product-catalog:latest

      # SCAN IMAGE BEFORE PUSHING
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # LOGIN ONLY AFTER SUCCESSFUL SCAN
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # PUSH IMAGE AFTER SCAN PASSES
      - name: Push Product Catalog Image
        run: |
          docker push ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}/product-catalog:latest

  docker_ad:
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy_fs]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BUILD IMAGE LOCALLY (NO PUSH YET)
      - name: Build Ad Service Image
        uses: docker/build-push-action@v6
        with:
          context: src/ad
          file: src/ad/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/ad:latest

      # SCAN IMAGE BEFORE PUSHING
      - name: Scan Ad Docker Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # LOGIN ONLY AFTER SUCCESSFUL SCAN
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # PUSH IMAGE AFTER SCAN PASSES
      - name: Push Ad Image
        run: |
          docker push ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}/ad:latest

  # =======================================================
  # GITOPS DEPLOY
  # =======================================================

  update_product_catalog:
    runs-on: ubuntu-latest
    needs: docker_product_catalog
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - name: Update tag in kubernetes deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.sha }}|" kubernetes/productcatalog/deploy.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email "${{ secrets.DOCKER_USER_EMAIL }}"
          git config --global user.name "${{ secrets.DOCKER_USERNAME }}"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "[CI]: Update product catalog image tag" || echo "No changes to commit"
          git push origin HEAD:main

  update_ad:
    runs-on: ubuntu-latest
    needs: docker_ad
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - name: Update tag in kubernetes deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/ad:${{ github.sha }}|" kubernetes/ad/deploy.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email "${{ secrets.DOCKER_USER_EMAIL }}"
          git config --global user.name "${{ secrets.DOCKER_USERNAME }}"
          git add kubernetes/ad/deploy.yaml
          git commit -m "[CI]: Update ad image tag" || echo "No changes to commit"
          git push origin HEAD:main