name: product-catalog-ci

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "kubernetes/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/product-catalog
  IMAGE_TAG: ${{ github.run_id }}

jobs:

# -------------------------------------------------------
# BUILD + TEST
# -------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Verify Go Version
        run: go version

      - name: Download Dependencies
        working-directory: src/product-catalog
        run: go mod download

      - name: Build Application
        working-directory: src/product-catalog
        run: |
          go mod tidy
          go build -v -o product-catalog .

      - name: Run Tests
        working-directory: src/product-catalog
        run: go test ./... -v

# -------------------------------------------------------
# GOLANGCI-LINT
# -------------------------------------------------------
  golangci_lint:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: src/product-catalog
          args: --timeout=5m

# -------------------------------------------------------
# GITLEAKS
# -------------------------------------------------------
  gitleaks:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          source: .
          args: detect --source src/product-catalog --verbose --redact

# -------------------------------------------------------
# TRIVY FILESYSTEM SCAN
# -------------------------------------------------------
  trivy_fs:
    runs-on: ubuntu-latest
    needs:
      - golangci_lint
      - gitleaks

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: src/product-catalog
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

# -------------------------------------------------------
# DOCKER BUILD + TRIVY IMAGE SCAN + PUSH
# -------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: trivy_fs

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # -----------------------------------------------
      # BUILD IMAGE LOCALLY FIRST
      # -----------------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -f src/product-catalog/Dockerfile \
            src/product-catalog

      # -----------------------------------------------
      # SCAN IMAGE BEFORE PUSHING
      # -----------------------------------------------
      - name: Scan Docker Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # -----------------------------------------------
      # PUSH IMAGE ONLY IF SCAN PASSES
      # -----------------------------------------------
      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

# -------------------------------------------------------
# GITOPS MANIFEST UPDATE
# -------------------------------------------------------
  update-manifest:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: MichaelRay06/microservices-deployment
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - name: Update Kubernetes Manifest Image
        run: |
          IMAGE_TAG=${{ github.run_id }}

          echo "Before update:"
          cat kubernetes/productcatalog/deploy.yaml

          sed -i "s|image: michaeltayo/product-catalog:.*|image: michaeltayo/product-catalog:${IMAGE_TAG}|g" kubernetes/productcatalog/deploy.yaml

          echo "After update:"
          cat kubernetes/productcatalog/deploy.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add kubernetes/productcatalog/deploy.yaml

          git commit -m "Update product-catalog image to ${IMAGE_TAG}" || echo "No changes to commit"

          git push origin main