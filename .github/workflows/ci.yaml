name: product-catalog-ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "kubernetes/**"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "kubernetes/**"

permissions:
  contents: write
  security-events: write

env:
  GO_VERSION: "1.22"
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ""
  GITHUB_USER_EMAIL: ${{ secrets.DOCKER_USER_EMAIL }}
  GITHUB_USER_NAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.CICD_GITHUB_TOKEN }}
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
  ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
  ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}

jobs:
  # -------------------------------------------------------
  # BUILD + TEST
  # -------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go Version
        run: go version

      - name: Download Dependencies
        working-directory: src/product-catalog
        run: go mod download

      - name: Build Application
        working-directory: src/product-catalog
        run: |
          go mod tidy
          go build -v -o product-catalog .

      - name: Run Tests
        working-directory: src/product-catalog
        run: |
          go test ./... -v -race -coverprofile=coverage.out

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/product-catalog/coverage.out

  # -------------------------------------------------------
  # GOLANGCI-LINT
  # -------------------------------------------------------
  golangci_lint:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: src/product-catalog
          args: --timeout=5m

  # -------------------------------------------------------
  # GITLEAKS
  # -------------------------------------------------------
  gitleaks:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

  # -------------------------------------------------------
  # TRIVY FILESYSTEM SCAN
  # -------------------------------------------------------
  trivy_fs:
    runs-on: ubuntu-latest
    needs:
      - golangci_lint
      - gitleaks

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: src/product-catalog
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload Trivy Scan Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif

  # -------------------------------------------------------
  # DOCKER BUILD + TRIVY IMAGE SCAN + PUSH
  # -------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: trivy_fs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Short Git SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA::10}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.GITHUB_USER_NAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # -----------------------------------------------
      # BUILD IMAGE LOCALLY
      # -----------------------------------------------
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          tags: ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------
      # SCAN IMAGE BEFORE PUSH
      # -----------------------------------------------
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image-results.sarif

      - name: Upload Trivy Image Scan Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif

      # -----------------------------------------------
      # PUSH IMAGE
      # -----------------------------------------------
      - name: Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/product-catalog:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # GITOPS MANIFEST UPDATE
  # -------------------------------------------------------
  update-manifest:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: MichaelRay06/microservices-deployment
          token: ${{ env.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Install kubectl
        run: |
          curl -O https://s3.us-west-2.amazonaws.com/amazon-eks/1.30.7/2024-12-12/bin/linux/amd64/kubectl
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd

      # - name: Login to ArgoCD
      #   run: |
      #     argocd login ${{ secrets.ARGOCD_SERVER }} \
      #       --username ${{ secrets.ARGOCD_USERNAME }} \
      #       --password ${{ secrets.ARGOCD_PASSWORD }} \
      #       --insecure

      - name: Set Short Git SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA::10}" >> $GITHUB_ENV

      - name: Update Kubernetes Manifest Image
        run: |
          echo "Before update:"
          cat kubernetes/productcatalog/deploy.yaml

          sed -i "s|image: .*product-catalog:.*|image: ${IMAGE_NAME}/product-catalog:${IMAGE_TAG}|g" kubernetes/productcatalog/deploy.yaml

          echo "After update:"
          cat kubernetes/productcatalog/deploy.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "${GITHUB_USER_NAME}"
          git config --global user.email "${GITHUB_USER_EMAIL}"

          if git diff --quiet kubernetes/productcatalog/deploy.yaml; then
            echo "No changes to commit"
            exit 0
          fi

          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "Update product-catalog image to ${IMAGE_TAG}"
          git push origin main