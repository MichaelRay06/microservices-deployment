name: microservices-ci

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "kubernetes/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  GRADLEPATH: src/ad

jobs:

  # =======================================================
  # BUILD + TEST
  # =======================================================

  build_product_catalog:
    runs-on: ubuntu-latest
    continue-on-error: true

    defaults:
      run:
        working-directory: src/product-catalog

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - run: go mod download
      - run: go mod tidy
      - run: go build -v -o product-catalog .
      - run: go test ./... -v

  # ==============================================
  # GRADLE BUILD AND TEST
  # ==============================================

  build_gradle:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
        working-directory: src/ad

      - name: Upgrade Gradle Wrapper to 8.8
        run: ./gradlew build --warning-mode all
        working-directory: src/ad

      - name: Build and Test with Gradle Wrapper
        run: ./gradlew build --warning-mode all
        working-directory: src/ad

  dependency-submission:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

  # -----------------------------------------------
  # PYTHON BUILD AND TEST
  # -----------------------------------------------

  build_python:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run pytest
        run: |
          pip install pytest
          export PYTHONPATH=src/recommendation

  # =======================================================
  # SECURITY (ALWAYS RUN)
  # =======================================================

  gitleaks:
    runs-on: ubuntu-latest
    needs: [build_product_catalog, build_python, build_gradle]
    if: always()
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --verbose --redact

  trivy_fs:
    runs-on: ubuntu-latest
    needs: [build_product_catalog, build_python, build_gradle]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  golangci_lint:
    runs-on: ubuntu-latest
    needs: build_product_catalog
    if: always()
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
          working-directory: src/product-catalog

  # =======================================================
  # DOCKER BUILD & PUSH (ALWAYS TRY)
  # =======================================================

  docker_product_catalog:
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy_fs, golangci_lint]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/product-catalog:latest

      - name: Scan Docker Image with Trivy
        # --rm means remove the Trivy image when scanning is completed
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}

  docker_ad:
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy_fs]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: src/ad
          file: src/ad/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/ad:latest

  docker_recommendation:
    runs-on: ubuntu-latest
    needs: [gitleaks, trivy_fs]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: src/recommendation
          file: src/recommendation/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}/recommendation:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/recommendation:latest

  # =======================================================
  # GITOPS DEPLOY (NOW ALWAYS RUN)
  # =======================================================

  update_product_catalog:
    runs-on: ubuntu-latest
    needs: docker_product_catalog
    if: always()

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - name: Update tag in kubernetes deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}|" kubernetes/productcatalog/deploy.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email ${{ secrets.DOCKER_USER_EMAIL }}
          git config --global user.name ${{ secrets.DOCKER_USERNAME }}
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "[CI]: Update product catalog image tag"
          git push origin HEAD:main -f

  update_ad:
    runs-on: ubuntu-latest
    needs: docker_ad
    if: always()

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - name: Update tag in kubernetes deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/ad:${{ github.run_id }}|" kubernetes/ad/deploy.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email ${{ secrets.DOCKER_USER_EMAIL }}
          git config --global user.name ${{ secrets.DOCKER_USERNAME }}
          git add kubernetes/ad/deploy.yaml
          git commit -m "[CI]: Update ad image tag"
          git push origin HEAD:main -f

  update_recommendation:
    runs-on: ubuntu-latest
    needs: docker_recommendation
    if: always()

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - name: Update tag in kubernetes deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/recommendation:${{ github.run_id }}|" kubernetes/recommendation/deploy.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email ${{ secrets.DOCKER_USER_EMAIL }}
          git config --global user.name ${{ secrets.DOCKER_USERNAME }}
          git add kubernetes/recommendation/deploy.yaml
          git commit -m "[CI]: Update recommendation image tag"
          git push origin HEAD:main -f