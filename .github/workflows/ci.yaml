name: microservices-ci

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "kubernetes/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

# =======================================================
# BUILD + TEST (PARALLEL SERVICES)
# =======================================================

  build_product_catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/product-catalog

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - run: go mod download
      - run: go mod tidy
      - run: go build -v -o product-catalog .
      - run: go test ./... -v

  build_ad:
  runs-on: ubuntu-latest

  defaults:
    run:
      working-directory: src/ad

  steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
        cache: gradle

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    # Optional: Pre-fetch dependencies (similar to Docker layer caching)
    - name: Download dependencies
      run: ./gradlew downloadRepos || true

    - name: Build project
      run: ./gradlew build --no-daemon --stacktrace

    - name: Run unit tests
      run: ./gradlew test --no-daemon --info

# =======================================================
# SECURITY (PARALLEL, NON-BLOCKING WHERE APPROPRIATE)
# =======================================================

  gitleaks:
    runs-on: ubuntu-latest
    needs: [build_product_catalog, build_ad]
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --verbose --redact

  trivy_fs:
    runs-on: ubuntu-latest
    needs: [build_product_catalog, build_ad]

    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  golangci_lint:
    runs-on: ubuntu-latest
    needs: build_product_catalog
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
          working-directory: src/product-catalog

# =======================================================
# DOCKER BUILD & PUSH
# =======================================================

  docker_product_catalog:
    runs-on: ubuntu-latest
    needs: [trivy_fs, gitleaks, golangci_lint]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/product-catalog:latest

      - name: Scan Image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}

  docker_ad:
    runs-on: ubuntu-latest
    needs: [trivy_fs, gitleaks]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}/ad:latest

      - name: Scan Image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}

# =======================================================
# GITOPS DEPLOY (PARALLEL UPDATES)
# =======================================================

  update_product_catalog:
    runs-on: ubuntu-latest
    needs: docker_product_catalog

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - run: |
          sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}/product-catalog:${{ env.IMAGE_TAG }}|" \
          kubernetes/productcatalog/deploy.yaml

      - run: |
          git config --global user.email ${{ secrets.DOCKER_USER_EMAIL }}
          git config --global user.name ${{ secrets.DOCKER_USERNAME }}
          git add kubernetes/productcatalog/deploy.yaml
          git diff --quiet || git commit -m "[GitOps] product-catalog -> ${{ env.IMAGE_TAG }}"
          git push origin HEAD:main

  update_ad:
    runs-on: ubuntu-latest
    needs: docker_ad

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}

      - run: |
          sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}/ad:${{ env.IMAGE_TAG }}|" \
          kubernetes/ad/deploy.yaml

      - run: |
          git config --global user.email ${{ secrets.DOCKER_USER_EMAIL }}
          git config --global user.name ${{ secrets.DOCKER_USERNAME }}
          git add kubernetes/ad/deploy.yaml
          git diff --quiet || git commit -m "[GitOps] ad -> ${{ env.IMAGE_TAG }}"
          git push origin HEAD:main